<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neighborhood Composition Atlas — OTR</title>
<link rel="stylesheet" href="leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>
<style>
  :root{ --bg:#faf7f2; --panel:#fff; --ink:#2a241c; --muted:#8a7f6e; --line:#e4ddce; --accent:#8c3b2e; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1c1812; --panel:#262019; --ink:#ece6da; --muted:#a79a85; --line:#3a3226; --accent:#d98a73; }
  }
  :root[data-theme="dark"]{ --bg:#1c1812; --panel:#262019; --ink:#ece6da; --muted:#a79a85; --line:#3a3226; --accent:#d98a73; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',serif;}
  #app{display:flex;height:100vh;}
  #mapWrap{flex:1 1 auto;min-width:0;position:relative;}
  #map{height:100%;width:100%;}
  #side{width:400px;flex:0 0 400px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;}
  @media (max-width:860px){
    #app{display:block;height:auto;min-height:100vh;}
    #mapWrap{height:42vh;min-height:280px;}
    #side{width:100%;}
  }
  .opacityCtrl{position:absolute;left:10px;bottom:10px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);}
  .opacityCtrl input{width:110px;}
  .mapLegend{position:absolute;right:10px;bottom:10px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:190px;}
  .mapLegend .lgTitle{font-weight:600;margin-bottom:5px;font-size:11px;}
  .mapLegend .lgGrad{height:10px;border-radius:3px;margin-bottom:3px;}
  .mapLegend .lgEnds{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);}
  .mapLegend .lgSwatchRow{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:10.5px;}
  .mapLegend .lgSwatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto;display:inline-block;}
  .mapLegend .lgNote{font-size:9.5px;color:var(--muted);margin-top:4px;}
  h1{font-size:17px;margin:0 0 2px;}
  .sub{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .ctrl-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  select,button{font:inherit;font-size:12px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
  button{cursor:pointer;}
  button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .block{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;background:var(--bg);}
  .block h2{font-size:13px;margin:0 0 6px;}
  .yr{margin-bottom:8px;}
  .yr .label{font-size:11px;color:var(--muted);margin-bottom:2px;}
  .bar{height:14px;display:flex;border-radius:3px;overflow:hidden;background:var(--line);}
  .bar span{height:100%;}
  .legend{font-size:10.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:-1px;}
  .stat{font-size:11.5px;color:var(--muted);}
  .caveat{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:8px;line-height:1.5;}
  .pill{display:inline-block;font-size:10px;background:var(--line);border-radius:10px;padding:1px 7px;margin-left:5px;}
  a.lnk{color:var(--accent);}
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.ygrid{border-collapse:collapse;font-size:11px;width:100%;min-width:480px;}
  table.ygrid th, table.ygrid td{padding:3px 5px;vertical-align:middle;text-align:left;white-space:nowrap;}
  table.ygrid th{color:var(--muted);font-weight:normal;border-bottom:1px solid var(--line);}
  table.ygrid td.rowlabel{color:var(--muted);white-space:normal;max-width:90px;}
  .minibar{height:11px;width:60px;display:flex;border-radius:2px;overflow:hidden;background:var(--line);}
  .minibar span{height:100%;}
  .cellnum{font-size:10.5px;color:var(--ink);}
  .cellsub{font-size:9.5px;color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <div id="mapWrap">
    <div id="map"></div>
    <div class="opacityCtrl">Sanborn opacity
      <input type="range" id="opacitySlider" min="0" max="100" value="85">
    </div>
    <div class="mapLegend" id="mapLegend"></div>
  </div>
  <div id="side">
    <h1>Neighborhood Composition Atlas <span class="pill">OTR</span></h1>
    <div class="sub">Neighborhood composition change, 1900–1940. Real-georeferenced Sanborn sheets, Cincinnati Over-the-Rhine.</div>

    <div class="ctrl-row" id="colorByRow"></div>
    <div class="ctrl-row" id="modeRow"></div>
    <div class="ctrl-row">
      <button id="clearBtn">Clear selection</button>
      <label style="font-size:11px;color:var(--muted);align-self:center;">Freeform: hold Shift + drag on map</label>
    </div>

    <div id="selectionBlock"></div>
    <div id="neighborhoodBlock"></div>

    <div class="caveat" id="caveat"></div>
  </div>
</div>
<script>
const COLOR_MODES = [
  {k:'pct_black', label:'% Black'},
  {k:'pct_rented', label:'% Rented'},
  {k:'persons_per_household', label:'Persons/hh'},
  {k:'lodger_pct', label:'Has lodger/boarder'},
];
const YEARS = ['1900','1910','1920','1930','1940'];
let DATA = null;
let colorBy = 'pct_black';
let mode = 'building';
let selected = [];  // array of address objects
let addrMarkers = [];
let shiftDrag = false, dragStart = null, dragRect = null;

function hexToRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function lerpColor(a,b,t){const ca=hexToRgb(a),cb=hexToRgb(b);const r=ca.map((c,i)=>Math.round(c+(cb[i]-c)*t));return `rgb(${r[0]},${r[1]},${r[2]})`;}

function latestYearData(a){
  if(!a.census_by_year) return null;
  for(let i=YEARS.length-1;i>=0;i--){ if(a.census_by_year[YEARS[i]]) return a.census_by_year[YEARS[i]]; }
  return null;
}
function colorFor(a){
  const d = latestYearData(a);
  if(!d) return '#999';
  if(colorBy==='lodger_pct') return d.n_lodger>0 ? '#8c3b2e' : '#bcae8f';
  let val, lo=0, hi=100;
  if(colorBy==='pct_black') val = d.pct_black;
  else if(colorBy==='pct_rented') val = d.pct_rented==null ? null : d.pct_rented;
  else if(colorBy==='persons_per_household'){ val = d.persons_per_household; lo=1; hi=6; }
  if(val==null) return '#999';
  const t = Math.max(0, Math.min(1, (val-lo)/(hi-lo)));
  return lerpColor('#f2e9d8', '#8c3b2e', t);
}

function uid(a){ return a.sheet+'|'+a.block_id+'|'+a.address; }

function renderLegend(){
  const el = document.getElementById('mapLegend');
  if(!el) return;
  const m = COLOR_MODES.find(c=>c.k===colorBy);
  if(colorBy==='lodger_pct'){
    el.innerHTML = `<div class="lgTitle">${m.label}</div>
      <div class="lgSwatchRow"><span class="lgSwatch" style="background:#8c3b2e"></span>Has a lodger/boarder</div>
      <div class="lgSwatchRow"><span class="lgSwatch" style="background:#bcae8f"></span>No lodger/boarder</div>
      <div class="lgSwatchRow"><span class="lgSwatch" style="background:#999"></span>No census match</div>`;
    return;
  }
  let lo=0, hi=100, loLabel='0%', hiLabel='100%';
  if(colorBy==='persons_per_household'){ lo=1; hi=6; loLabel='1'; hiLabel='6+'; }
  else if(colorBy==='pct_rented'){ loLabel='0% (owned)'; hiLabel='100% (rented)'; }
  el.innerHTML = `<div class="lgTitle">${m.label}</div>
    <div class="lgGrad" style="background:linear-gradient(to right, #f2e9d8, #8c3b2e);"></div>
    <div class="lgEnds"><span>${loLabel}</span><span>${hiLabel}</span></div>
    <div class="lgSwatchRow"><span class="lgSwatch" style="background:#999"></span>No census match</div>
    <div class="lgNote">Shaded by each address's most recent census year on record.</div>`;
}

function renderControls(){
  const cRow = document.getElementById('colorByRow');
  cRow.innerHTML = '<span class="stat" style="align-self:center;">Color by:</span>';
  COLOR_MODES.forEach(m=>{
    const b = document.createElement('button');
    b.textContent = m.label;
    b.className = (colorBy===m.k) ? 'active' : '';
    b.onclick = ()=>{ colorBy = m.k; renderControls(); redrawMarkers(); renderLegend(); };
    cRow.appendChild(b);
  });
  const mRow = document.getElementById('modeRow');
  mRow.innerHTML = '<span class="stat" style="align-self:center;">Select by:</span>';
  [['building','Building'],['block','Block face'],['freeform','Freeform']].forEach(([k,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = (mode===k) ? 'active' : '';
    b.onclick = ()=>{ mode = k; renderControls(); };
    mRow.appendChild(b);
  });
}

// Aggregate every tracked category, for every census year, for a set of addresses.
function yearAggregates(addrs){
  const out = {};
  YEARS.forEach(yr=>{
    let n=0,nb=0,nw=0,no=0,nr=0,nown=0,npp=0,hh=0,nlodge=0,ntot=0;
    const occTotals = {}; let nOccKnown=0; const incomes=[]; const occscores=[]; const rents=[];
    const originTotals = {}; let nBplKnown=0; let nForeign=0;
    addrs.forEach(a=>{
      const d = a.census_by_year && a.census_by_year[yr];
      if(!d) return;
      n++; nb+=d.n_black; nw+=d.n_white; no+=d.n_other_race;
      if(d.n_owned!=null) nown+=d.n_owned; if(d.n_rented!=null) nr+=d.n_rented;
      npp += d.n_residents; hh += d.n_households; nlodge += d.n_lodger; ntot += d.n_residents;
      (d.top_occupations||[]).forEach(([label,count])=>{ occTotals[label]=(occTotals[label]||0)+count; });
      nOccKnown += d.n_occ_known||0;
      if(d.median_income!=null) incomes.push(d.median_income);
      if(d.avg_occscore!=null) occscores.push(d.avg_occscore);
      if(d.avg_rent!=null) rents.push(d.avg_rent);
      if(d.n_bpl_known){
        nBplKnown += d.n_bpl_known;
        if(d.pct_foreign_born!=null) nForeign += Math.round(d.pct_foreign_born/100*d.n_bpl_known);
        (d.top_origins||[]).forEach(([label,pct])=>{
          originTotals[label] = (originTotals[label]||0) + Math.round(pct/100*d.n_bpl_known);
        });
      }
    });
    if(n===0){ out[yr]=null; return; }
    const pb = ntot?Math.round(100*nb/ntot):0, pw=ntot?Math.round(100*nw/ntot):0, po=Math.max(0,100-pb-pw);
    const tenureKnown = nown+nr;
    const pr = tenureKnown?Math.round(100*nr/tenureKnown):null;
    const ppl = hh? +(npp/hh).toFixed(2) : null;
    const lp = ntot?Math.round(100*nlodge/ntot):0;
    const occDist = Object.entries(occTotals).sort((a,b)=>b[1]-a[1])
      .map(([label,count])=>[label, nOccKnown?Math.round(100*count/nOccKnown):0]);
    const topOccSorted = occDist.slice(0,3);
    const avgInc = incomes.length ? Math.round(incomes.reduce((s,v)=>s+v,0)/incomes.length) : null;
    const avgScore = occscores.length ? +(occscores.reduce((s,v)=>s+v,0)/occscores.length).toFixed(1) : null;
    const avgRent = rents.length ? Math.round(rents.reduce((s,v)=>s+v,0)/rents.length) : null;
    const pctForeign = nBplKnown ? Math.round(100*nForeign/nBplKnown) : null;
    const topOrigins = Object.entries(originTotals).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([label,count])=>[label, nBplKnown?Math.round(100*count/nBplKnown):0]);
    out[yr] = {n, ntot, pb, pw, po, pr, ppl, lp, topOcc: topOccSorted, occDist, avgInc, avgScore, avgRent, pctForeign, topOrigins};
  });
  return out;
}

// One table: rows = category, columns = census years, cells = mini stacked-bar + numbers.
function renderYearGrid(addrs, title){
  if(!addrs.length) return `<div class="block"><h2>${title}</h2><div class="stat">No matched census data.</div></div>`;
  const agg = yearAggregates(addrs);
  const yrsWithData = YEARS.filter(y=>agg[y]);
  if(!yrsWithData.length) return `<div class="block"><h2>${title}</h2><div class="stat">No matched census data.</div></div>`;

  const head = `<tr><th></th>${YEARS.map(y=>`<th>${y}</th>`).join('')}</tr>`;

  const rowAddr = `<tr><td class="rowlabel">Addresses matched</td>${YEARS.map(y=>{
    const d=agg[y]; return `<td>${d?`<span class="cellnum">${d.n}</span>`:'<span class="cellsub">—</span>'}</td>`;
  }).join('')}</tr>`;

  const rowRace = `<tr><td class="rowlabel">Race (White/Black/Other)</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d) return '<td><span class="cellsub">—</span></td>';
    return `<td><div class="minibar" title="White ${d.pw}%, Black ${d.pb}%, Other ${d.po}%">
      <span style="width:${d.pw}%;background:#d8c9a3"></span><span style="width:${d.pb}%;background:#8c3b2e"></span><span style="width:${d.po}%;background:#6b7a8f"></span>
      </div><div class="cellsub">${d.pb}% Black</div></td>`;
  }).join('')}</tr>`;

  const rowTenure = `<tr><td class="rowlabel">% Rented</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.pr==null) return '<td><span class="cellsub">—</span></td>';
    return `<td><div class="minibar"><span style="width:${d.pr}%;background:#6b7a8f"></span><span style="width:${100-d.pr}%;background:#d8c9a3"></span></div><div class="cellsub">${d.pr}%</div></td>`;
  }).join('')}</tr>`;

  const maxPpl = Math.max(1, ...yrsWithData.map(y=>agg[y].ppl||0));
  const rowDensity = `<tr><td class="rowlabel">Persons/household</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.ppl==null) return '<td><span class="cellsub">—</span></td>';
    const w = Math.round(100*d.ppl/maxPpl);
    return `<td><div class="minibar"><span style="width:${w}%;background:#b08968"></span></div><div class="cellsub">${d.ppl}</div></td>`;
  }).join('')}</tr>`;

  const rowLodger = `<tr><td class="rowlabel">Lodger/boarder share</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d) return '<td><span class="cellsub">—</span></td>';
    return `<td><div class="minibar"><span style="width:${d.lp}%;background:#8c3b2e"></span></div><div class="cellsub">${d.lp}%</div></td>`;
  }).join('')}</tr>`;

  const rowOcc = `<tr><td class="rowlabel">Top occupation</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||!d.topOcc.length) return '<td><span class="cellsub">—</span></td>';
    const [label,pct] = d.topOcc[0];
    return `<td><div class="cellnum" style="white-space:normal;max-width:90px;">${label}</div><div class="cellsub">${pct}% of workers</div></td>`;
  }).join('')}</tr>`;

  const OCC_ORDER = ['Professional/technical','Managers/officials/proprietors','Clerical','Sales',
    'Craftsmen/foremen','Operatives','Service workers','Laborers (non-farm)','Farmers/farm laborers','Other/unclassified'];
  const OCC_COLORS = ['#4a7c6f','#6b8f71','#a8b86a','#d9b44a','#c97d3f','#b24d3f','#8c3b2e','#6b7a8f','#4a5a73','#9a9a9a'];
  const occColor = label => OCC_COLORS[OCC_ORDER.indexOf(label)] ?? '#999';
  const rowOccDist = `<tr><td class="rowlabel">Occupation mix<div class="cellsub" style="font-weight:400;">(share of workers)</div></td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||!d.occDist||!d.occDist.length) return '<td><span class="cellsub">—</span></td>';
    const bars = d.occDist.map(([label,pct])=>`<span style="width:${pct}%;background:${occColor(label)}" title="${label}: ${pct}%"></span>`).join('');
    return `<td><div class="minibar" style="width:90px;">${bars}</div></td>`;
  }).join('')}</tr>`;

  const rowInc = `<tr><td class="rowlabel">Avg wage income</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.avgInc==null) return '<td><span class="cellsub">—</span></td>';
    return `<td><span class="cellnum">$${d.avgInc.toLocaleString()}</span></td>`;
  }).join('')}</tr>`;

  const rowRent = `<tr><td class="rowlabel">Avg monthly rent</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.avgRent==null) return '<td><span class="cellsub">—</span></td>';
    return `<td><span class="cellnum">$${d.avgRent}</span></td>`;
  }).join('')}</tr>`;

  const maxScore = Math.max(1, ...yrsWithData.map(y=>agg[y].avgScore||0));
  const rowScore = `<tr><td class="rowlabel">Occupational income score<div class="cellsub" style="font-weight:400;">(proxy, 0-80)</div></td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.avgScore==null) return '<td><span class="cellsub">—</span></td>';
    const w = Math.round(100*d.avgScore/maxScore);
    return `<td><div class="minibar"><span style="width:${w}%;background:#b08968"></span></div><div class="cellsub">${d.avgScore}</div></td>`;
  }).join('')}</tr>`;

  const rowForeign = `<tr><td class="rowlabel">Foreign-born share</td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||d.pctForeign==null) return '<td><span class="cellsub">—</span></td>';
    return `<td><div class="minibar"><span style="width:${d.pctForeign}%;background:#4a5a73"></span></div><div class="cellsub">${d.pctForeign}%</div></td>`;
  }).join('')}</tr>`;

  const rowOrigins = `<tr><td class="rowlabel">Top countries of origin<div class="cellsub" style="font-weight:400;">(foreign-born)</div></td>${YEARS.map(y=>{
    const d=agg[y]; if(!d||!d.topOrigins||!d.topOrigins.length) return '<td><span class="cellsub">—</span></td>';
    const lines = d.topOrigins.map(([label,pct])=>`${label} ${pct}%`).join('<br>');
    return `<td><div class="cellsub" style="white-space:normal;max-width:100px;line-height:1.5;">${lines}</div></td>`;
  }).join('')}</tr>`;

  const occLegend = OCC_ORDER.map((label,i)=>`<span><i style="background:${OCC_COLORS[i]}"></i>${label}</span>`).join('');

  return `<div class="block"><h2>${title}</h2><div class="stat" style="margin-bottom:6px;">${addrs.length} addresses in selection</div>
    <div class="gridwrap"><table class="ygrid">${head}${rowAddr}${rowRace}${rowTenure}${rowDensity}${rowLodger}${rowOcc}${rowOccDist}${rowInc}${rowRent}${rowScore}${rowForeign}${rowOrigins}</table></div>
    <div class="legend" style="margin-top:6px;"><span><i style="background:#d8c9a3"></i>White/Owned</span><span><i style="background:#8c3b2e"></i>Black/Lodger</span><span><i style="background:#6b7a8f"></i>Other/Rented</span></div>
    <div class="legend" style="margin-top:3px;">${occLegend}</div>
    <div class="caveat" style="margin-top:4px;">Occupational income score is a proxy (median 1950 income by occupation type) used because the census did not collect wage/income data before 1940 — it tracks occupational standing, not actual earnings.</div>
    </div>`;
}

function renderSelection(){
  const el = document.getElementById('selectionBlock');
  if(!selected.length){ el.innerHTML = ''; return; }
  const label = mode==='building' && selected.length===1 ? `${selected[0].street} ${selected[0].address}` :
    mode==='block' ? `Block: ${selected[0].block_id}` : `Your selection (${selected.length})`;
  el.innerHTML = renderYearGrid(selected, `Your selection — ${label}`);
}
function renderNeighborhood(){
  const anchored = DATA.addresses.filter(a=>a.census_by_year);
  const el = document.getElementById('neighborhoodBlock');
  el.innerHTML = renderYearGrid(anchored, 'Neighborhood overview (all anchored addresses)');
}

function groupKeyFor(a){ return mode==='block' ? (a.sheet+'|'+a.block_id) : null; }

function selectAddress(a, additive){
  if(mode==='block'){
    const key = groupKeyFor(a);
    selected = DATA.addresses.filter(x=>groupKeyFor(x)===key);
  } else {
    selected = [a];
  }
  renderSelection();
}

function redrawMarkers(){
  addrMarkers.forEach(m=>m.setStyle({fillColor: colorFor(m._addr), color: colorFor(m._addr)}));
}

function initMap(){
  const map = L.map('map', {zoomSnap:0.25}).setView([39.1095, -84.5125], 15);
  const grayBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, HERE, Garmin', maxZoom: 19
  });
  const grayLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, pane: 'shadowPane'
  });
  const aerialBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, Maxar, Earthstar Geographics', maxZoom: 19
  }).addTo(map);
  const aerialLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, pane: 'shadowPane'
  }).addTo(map);
  const grayscaleGroup = L.layerGroup([grayBase, grayLabels]);
  const aerialGroup = L.layerGroup([aerialBase, aerialLabels]);
  L.control.layers({'Aerial + streets': aerialGroup, 'Grayscale + streets': grayscaleGroup}, {}, {position:'topright'}).addTo(map);

  const overlayLayer = L.layerGroup().addTo(map);
  let overlayCount = 0, overlayErrors = 0;
  // draw larger sheets first (bottom), smaller/more-precise pieces last (on top),
  // so overlapping georeferenced edges don't bury the finer sheet's detail
  function quadArea(s){
    const [tlLat,tlLon]=s.topleft, [trLat,trLon]=s.topright, [blLat,blLon]=s.bottomleft;
    const w = Math.hypot(trLat-tlLat, trLon-tlLon);
    const h = Math.hypot(blLat-tlLat, blLon-tlLon);
    return w*h;
  }
  const sheetEntries = Object.entries(DATA.sheets).sort((a,b)=>quadArea(b[1])-quadArea(a[1]));
  sheetEntries.forEach(([code, s])=>{
    try {
      const ov = L.imageOverlay.rotated(s.img, L.latLng(s.topleft), L.latLng(s.topright), L.latLng(s.bottomleft), {opacity:0.85, interactive:false});
      ov.addTo(overlayLayer);
      ov.on('load', ()=>{ overlayCount++; });
      ov.on('error', (e)=>{ overlayErrors++; console.error('sheet image failed to load', code, s.img, e); });
    } catch(err){ console.error('overlay failed', code, err); }
  });
  if (typeof L.imageOverlay.rotated !== 'function') {
    console.error('Leaflet.ImageOverlay.Rotated plugin did not load — sheets will not render.');
  }
  const opacitySlider = document.getElementById('opacitySlider');
  opacitySlider.addEventListener('input', ()=>{
    const v = opacitySlider.value/100;
    overlayLayer.eachLayer(l=>l.setOpacity(v));
  });

  const markerLayer = L.layerGroup().addTo(map);
  DATA.addresses.forEach(a=>{
    if(!a.latlon) return;
    const m = L.circleMarker(a.latlon, {radius:4, weight:1, color:colorFor(a), fillColor:colorFor(a), fillOpacity:0.9});
    m._addr = a;
    m.on('click', (e)=>{ L.DomEvent.stopPropagation(e); selectAddress(a); });
    m.addTo(markerLayer);
    addrMarkers.push(m);
  });

  // freeform rectangle select: hold Shift and drag
  map.on('mousedown', (e)=>{
    if(!e.originalEvent.shiftKey) return;
    shiftDrag = true; dragStart = e.latlng; map.dragging.disable();
    dragRect = L.rectangle([dragStart, dragStart], {color:'#8c3b2e', weight:1, fillOpacity:0.08}).addTo(map);
  });
  map.on('mousemove', (e)=>{
    if(!shiftDrag) return;
    dragRect.setBounds(L.latLngBounds(dragStart, e.latlng));
  });
  map.on('mouseup', (e)=>{
    if(!shiftDrag) return;
    shiftDrag = false; map.dragging.enable();
    const bounds = L.latLngBounds(dragStart, e.latlng);
    mode = 'freeform'; renderControls();
    selected = DATA.addresses.filter(a=> a.latlon && bounds.contains(a.latlon));
    renderSelection();
    map.removeLayer(dragRect); dragRect = null;
  });
}

fetch('otr_geo_data.json').then(r=>r.json()).then(d=>{
  DATA = d;
  renderControls();
  renderNeighborhood();
  initMap();
  renderLegend();
  document.getElementById('clearBtn').onclick = ()=>{ selected=[]; renderSelection(); };
  document.getElementById('caveat').innerHTML =
    `<b>Status:</b> ${Object.keys(DATA.sheets).length} Sanborn sheet pieces now placed on real geographic coordinates ` +
    `(from hand-placed georeferencing, not pixel positions). Address anchoring + census matching (the dots, and the ` +
    `composition panels) still only covers sheets 101–103 (574 addresses); the rest of the sheets are visible on the map ` +
    `but have no address points yet — this is expected as georeferencing/anchoring continues sheet by sheet. ` +
    `Sheets 102 and 103's addresses are precisely remapped from the full sheet's pixel space into the "a" split piece's ` +
    `own georeference (recovered via feature matching between the full sheet and the piece image). ` +
    `<b>Not yet in this extract:</b> educational attainment (never pulled — would need a further IPUMS extract with EDUC) ` +
    `and home value (reported by too few owners in this renter-heavy neighborhood to be meaningful — well under 1% of ` +
    `records across all years). Monthly rent is shown where the 1940 sample reports it.`;
});
</script>
